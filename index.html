<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>胶片放行台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">纸质放映胶片整理</p>
          <h1>胶片放行台</h1>
          <p class="subtitle">外检回执归并裁定 · 许可绑定作废 · 每盘 150 秒重新排盘</p>
        </div>
        <div class="hero-stats">
          <div>
            <span>总时长</span>
            <strong id="totalDuration">0:00</strong>
          </div>
          <div>
            <span>破损片段</span>
            <strong id="damageCount">0</strong>
          </div>
          <div>
            <span>待裁定</span>
            <strong id="pendingCount">0</strong>
          </div>
          <div>
            <span>片段数</span>
            <strong id="segmentCount">0</strong>
          </div>
        </div>
      </header>

      <nav class="tabs" id="tabs">
        <button data-tab="segments" class="active">片段</button>
        <button data-tab="receipts">回执<span class="tab-badge" id="tabBadge-receipts"></span></button>
        <button data-tab="reels">装盘</button>
        <button data-tab="permits">许可<span class="tab-badge" id="tabBadge-permits"></span></button>
        <button data-tab="batches">批次<span class="tab-badge" id="tabBadge-batches"></span></button>
      </nav>

      <div class="save-bar">
        <span class="save-status" id="saveStatus">已保存</span>
        <button id="saveBtn" class="primary">保存 <kbd>Ctrl+S</kbd></button>
      </div>

      <div id="remoteBanner" class="remote-banner" hidden>
        另一个窗口已保存更新的版本，当前窗口的修改未覆盖。
        <button id="reloadRemoteBtn">重新加载</button>
      </div>

      <section id="page" class="page"></section>
    </main>

    <div id="toast" class="toast" hidden></div>

    <script src="js/rules.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="app.js"></script>
  </body>
</html>
